<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TRAVELER DEV E2E Test</title>
</head>
<body>
  <main>
    <h1>TRAVELER DEV Browser Test</h1>

    <button id="load-user" type="button">
      Load User
    </button>

    <button id="calculate" type="button">
      Calculate
    </button>

    <p id="status" role="status">Ready</p>
    <output id="result"></output>
  </main>

  <script>
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");

    document.querySelector("#load-user").addEventListener("click", () => {
      const user = {
        name: "Traveler Developer"
      };

      status.textContent = "User loaded";
      result.textContent = user.name;
    });

    document.querySelector("#calculate").addEventListener("click", () => {
      const values = [10, 20, 30];
      const total = values.reduce((sum, value) => sum + value, 0);

      status.textContent = "Calculation complete";
      result.textContent = String(total);
    });
  </script>
</body>
</html>
