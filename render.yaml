services:
  - type: web
    name: agent-traveler-dev2
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PRIMARY_MODEL
        value: llama3-70b-8192
      - key: WEBCONTAINER_ENABLED
        value: "true"
